# Runs the library check on every push and pull request, so problems
# (missing descriptions, undeclared placeholders, unexplained tags…) are caught before merging.
name: Check library

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
